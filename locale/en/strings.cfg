[technology-description]
logistic-cannon=A flexible way to transport item over medium distance, but consumes electricity and capsule.
compact-cannon-receiver=A compact version of cannon receiver with smaller inventory size.
reinforced-cannon-capsule=A new type of capsule which use lightweight material to significantly improve it's payload size.
propelled-cannon-capsule=By burning fuel to provide propelled force, the capsule can achieve very high speed.
cannon-launcher-range-upgrade=Upgrade the range of all cannon launchers.
cannon-launcher-energy-efficiency-upgrade=Upgrade the cannon launcher energy efficiency to improve shooting speed.

