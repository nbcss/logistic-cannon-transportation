lct-capsule-propelled=Propelled cannon capsule

[item-description]
lct-launcher=Deliver items to the receivers in range, each delivery consumes one capsule.
lct-receiver=Request items from the nearby launchers.
lct-receiver-small=Smaller version of cannon receiver with reduced inventory size.

