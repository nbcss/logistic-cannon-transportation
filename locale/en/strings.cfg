[mod-setting-description]
lct-coloring-projectile-smoke=When checked, the smoke following the capsule projectile will be colored differently according to its type.
lct-entity-update-interval=The interval between each entity update. Lower value makes deliveries more responsive, at a UPS cost.
lct-range-visualization-mode=The style of the circle visualizing launcher ranges while building.

[string-mod-setting]
#<setting-name>-<dropdown-item-name>=<translated dropdown item>
lct-range-visualization-mode-filled=Filled
lct-range-visualization-mode-edge=Bordered
lct-capsule-consumption-mode-standard=Standard
lct-capsule-consumption-mode-no-consumption=No consumption

[string-mod-setting-description]
#<setting-name>-<dropdown-item-name>=<tooltip of dropdown item>
lct-range-visualization-mode-filled=Display a filled circle for each launcher. May be too bright if many launchers' ranges overlap.
lct-range-visualization-mode-edge=Display a bordered circle with for each launcher.
lct-capsule-consumption-mode-standard=Each delivery consumes one capsule and electricity, require ongoing supply of capsules.
lct-capsule-consumption-mode-no-consumption=Delivery not longer consume capsule, but launchers still need at least one capsule in ammo slot to operate. Significantly increase electricity cost of delivery and craft cost of all capsules.

[gui-alert-tooltip]
capsule-delivery-failed=Capsule failed to deliver all it's contents to a receiver.

