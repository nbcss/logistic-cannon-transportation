[mod-name]
logistic-cannon-transportation=物流炮

[mod-description]
logistic-cannon-transportation=使用电磁来投射物品。

[entity-name]
lct-launcher=物流炮发射站
lct-receiver=物流炮请求站

[entity-description]

[technology-name]
logistic-cannon=物流炮
reinforced-cannon-capsule=强化货运舱
propelled-cannon-capsule=推进货运舱
cannon-launcher-range-upgrade=物流炮射程升级
cannon-launcher-energy-efficiency-upgrade=物流炮能量效率升级
cannon-capsule-productivity-upgrade=货运舱增产计划

[technology-description]
logistic-cannon=一种灵活的运输方式，但每次运输需要消耗电力和货运舱。
reinforced-cannon-capsule=一种利用轻型材料来显著增加运载量的货运舱。
propelled-cannon-capsule=通过燃烧舱体内的燃料，这种货运舱可以达到很高的飞行速度。
cannon-launcher-range-upgrade=提升所有物流炮发射站的射程。
cannon-launcher-energy-efficiency-upgrade=通过提升发射站的能量利用率，物流炮的射速将获得提升。

[modifier-description]
lct-launcher-range-bonus-damage-bonus=发射站射程: +__1__
lct-launcher-energy-capacity-modifier-damage-bonus=发射站电量存储: +__1__
lct-launcher-energy-consumption-modifier-damage-bonus=发射站电量消耗: [font=lct-negative-effect]__1__[/font]

[ammo-category-name]
lct-capsule=货运舱

[item-name]
lct-capsule-basic=基础货运舱
lct-capsule-reinforced=强化货运舱
lct-capsule-propelled=推进货运舱

[item-description]
lct-launcher=将库存内的货物发射至范围内需求该物品的请求站，每次配送消耗一个货运舱。
lct-receiver=能够从周围的炮发射站请求物品。

[mod-setting-name]
lct-coloring-projectile-smoke=炮弹轨迹烟雾颜色
lct-entity-update-interval=实体更新频率（游戏刻）
lct-gui-update-interval=GUI更新频率（游戏刻）
lct-default-launcher-auto-load-setting=默认启用发射站从库存填充弹药设置
lct-default-launcher-side-load-setting=默认启用发射站从侧面填充弹药设置
lct-range-visualization-mode=射程范围预览样式
lct-capsule-consumption-mode=货运舱消耗模式

[mod-setting-description]
lct-coloring-projectile-smoke=启用时，炮弹的烟雾的颜色将被其种类决定。
lct-entity-update-interval=实体被更新的时间间隔。较低的值使配送响应更快，但性能消耗较高。
lct-range-visualization-mode=建筑时显示所有发射站射程范围的预览样式。

[string-mod-setting]
#<setting-name>-<dropdown-item-name>=<translated dropdown item>
lct-range-visualization-mode-filled=实心
lct-range-visualization-mode-edge=边缘
lct-capsule-consumption-mode-standard=标准
lct-capsule-consumption-mode-no-consumption=无消耗

[string-mod-setting-description]
#<setting-name>-<dropdown-item-name>=<tooltip of dropdown item>
lct-range-visualization-mode-filled=填充所有发射站的射程预览，但在较多发射站射程重叠时可能会过亮。
lct-range-visualization-mode-edge=仅显示所有发射站的射程边缘。
lct-capsule-consumption-mode-standard=每次配送均消耗一个货运舱和标准量能量，物流需要持续的货运舱供应。
lct-capsule-consumption-mode-no-consumption=配送不再消耗货运舱，但发射站依然至少需要一个货运舱在弹药槽内才能运作。配送所需能量和货运舱生产成本被大幅增加。

[gui-alert-tooltip]
capsule-delivery-failed=货运舱无法将全部货物交付到目标！

